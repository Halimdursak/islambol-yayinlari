# GitHub Pages yayını (ADR-006). main'e her push'ta ya da elle (Actions > Run workflow) çalışır.
# Ön koşul (bir kez): Depo > Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: Pages'e yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek yayın; yarım kalan yayını iptal etme (Pages belgesindeki öneri).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Özel alan adı (ADR-016): site alan adı kökünde yayınlanır, alt dizin öneki yoktur.
      # Alan adı GitHub'da depo > Settings > Pages > Custom domain'e yazılır (Actions ile yayında CNAME dosyası gerekmez).
      # Ayrıntı: README "Özel alan adı". Eski adres https://halimdursak.github.io/islambol-yayinlari/ alan adına yönlenir.
      SITE_URL: https://islambol.org
      PATH_PREFIX: /
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
